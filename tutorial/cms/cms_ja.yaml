RAG:
  Documents:
    CompanyBenefits: |
      # Axon Corp — 従業員福利厚生ガイド

      本書は、Axon Corp全従業員が利用可能な福利厚生パッケージの詳細を記載しています。特に記載がない限り、福利厚生は入社初日から有効です。

      ---

      ## 1. 健康保険

      Axon Corpは従業員の健康保険料の100%、扶養家族の保険料の80%を負担します。補償内容には医療・歯科・眼科が含まれます。従業員はスタンダードPPOプランまたは高額控除型医療保険（HDHP）と会社が拠出する健康貯蓄口座（HSA、年間最大$1,500）の組み合わせから選択できます。

      ---

      ## 2. 年次有給休暇

      全フルタイム従業員は年20日の有給休暇を付与され、毎月積み立てられます。勤続5年後は25日に増加します。最大10日分の未使用休暇は翌年に繰り越し可能です。休暇取得は直属マネージャーの承認が必要で、少なくとも5営業日前に申請してください。

      ---

      ## 3. リモートワーク制度

      従業員は週最大3日のリモートワークが可能です。完全リモートの申請は入社6ヶ月後から可能で、マネージャーおよびHRの承認が必要です。会社はホームオフィス環境整備のための一時金$800と月額インターネット手当$50を提供します。

      ---

      ## 4. 学習・成長予算

      各従業員は、職務に関連するコース・資格取得・カンファレンス・書籍に使用できる年間$2,000の学習予算を受け取ります。申請はHRポータルから行います。未使用の予算は翌年に繰り越されません。会社負担の資格取得から6ヶ月以内に退職した場合、費用の返還を求められることがあります。

      ---

      ## 5. 育児休暇

      主な養育者は16週間の完全有給育児休暇を受け取ります。副次的な養育者は4週間の完全有給育児休暇を受け取ります。休暇は子供の誕生または養子縁組後12ヶ月以内であればいつでも取得できます。従業員は計画開始日の少なくとも8週間前にHRへ通知する必要があります。

      ---

      ## 6. 退職金制度（401k）

      Axon Corpは、従業員給与の最大5%を会社がマッチング拠出する401(k)退職金制度を提供します。マッチング分は勤続2年後に完全に権利確定します。従業員は入社日に4%の拠出率で自動登録され、いつでも福利厚生ポータルから変更できます。

      ---

      ## 7. メンタルヘルスサポート

      全従業員は、認定セラピストによる年間最大8回の無料カウンセリングセッションを提供する従業員支援プログラム（EAP）を利用できます。このサービスは機密が守られ、電話・ビデオ・対面で24時間365日利用可能です。また、標準の健康保険プランによりメンタルヘルス受診は追加自己負担なしでカバーされます。

      ---

      ## 8. フレックス勤務時間

      コアタイムは10:00〜16:00です。コアタイム外は、週の契約時間を満たす限り、従業員は自分のスケジュールに合わせて始業・終業時間を調整できます。マネージャーの承認により圧縮勤務（例：週4日×10時間）も可能です。

      ---

      ## 9. ウェルネス手当

      従業員は月額$100のウェルネス手当を受け取ることができ、ジムの会員費・フィットネスクラス・スポーツ用品・瞑想アプリ、その他承認されたウェルネス活動に充当できます。請求はHRポータルから領収書とともに費用発生から30日以内に提出します。

      ---

      ## 10. ストックオプション

      全フルタイム従業員は、入社時の年間基本給の10%相当のストックオプションが付与されます。オプションは4年間で権利確定し、最初の1年はクリフ期間です。行使価格は付与日の公正市場価格に設定されます。詳細はオンボーディング時に署名する個別オプション契約書に記載されています。

      ---

      ## 11. 通勤手当

      オフィスへの通勤者は、公共交通機関の定期券または駐車場代として月額最大$150を税引き前経費として申請できます。申請は給与処理を通じて行われ、課税所得が軽減されます。この特典は完全リモートの従業員には適用されません。

      ---

      ## 12. サバティカル休暇

      継続勤続5年を達成した従業員は、4週間の有給サバティカル休暇を申請できます。サバティカルは自己啓発・旅行・休息に活用できます。申請は3ヶ月前に提出する必要があり、業務上の必要性とマネージャーの承認が条件となります。サバティカル休暇は利用後リセットされ、さらに5年後に再び取得可能になります。

      ---

      ## 13. 機器・テクノロジー

      全従業員は希望のノートパソコン（MacBookまたはThinkPad、上限$2,500）を支給され、3年ごとに更新されます。モニター・キーボード・ヘッドセットなどの周辺機器は申請に応じて提供されます。リモートワーク中の従業員は機器の自宅配送を依頼できます。

      ---

      ## 14. 全社祝日

      年次有給休暇に加え、全従業員は年間12日の有給公休日を受け取ります。具体的な日程は従業員の所在国の現地祝日カレンダーに従います。また、文化的または個人的に重要な日付のために、年間2日の変動祝日が付与されます。

      ---

      ## お問い合わせ

      本ガイドに記載されている福利厚生についてのご質問は、HRチーム（**hr@axoncorp.example**）までご連絡いただくか、社内HRポータル（**hr.axoncorp.internal**）をご覧ください。
    Momotaro: |
      桃太郎の物語

      むかしむかし、日本のある小さな村に、心優しいおじいさんとおばあさんが住んでいました。二人には子供がなく、いつも寂しく思っていました。毎日、おじいさんは山へ柴刈りに行き、おばあさんは川へ洗濯に行っていました。

      ある日、おばあさんが川で洗濯をしていると、川上から大きな桃がどんぶらこ、どんぶらこと流れてきました。今まで見たこともないほど大きな桃で、丸くて赤らみながら、水の上にゆらゆらと浮かんでいました。おばあさんはそれを引き上げ、おじいさんと一緒に食べようと家に持ち帰りました。

      その夕方、おじいさんが家に帰ると、二人は一緒に座って桃を切ろうとしました。ところが切ろうとした瞬間、桃がひとりでに割れ、中から元気な男の赤ちゃんが飛び出してきました！老夫婦はたいそう喜びました。この子は天から自分たちを慰めるために授けられたのだと信じ、「桃太郎」と名付けました。

      桃太郎は強く、勇敢で、心優しい青年に育ちました。村一番の若者でした。成長するにつれ、遠い鬼ヶ島という島に鬼の一団が住んでいるという話を耳にしました。鬼たちは何年もの間、宝を奪い、人々に多大な苦しみを与えながら暴れ回っていました。

      桃太郎は鬼ヶ島へ行って鬼を退治しようと決心しました。お母さんに日本一のきびだんごを作ってもらい、だんごを腰に結び、勇気を胸に旅に出ました。

      道中、桃太郎は一匹の犬に出会いました。犬は空気をくんくん嗅いで尋ねました。「その良い匂いは何ですか？」

      「これは日本一のきびだんごだ」と桃太郎は答えました。「鬼ヶ島へ鬼退治に行くところだ。」

      犬は深くお辞儀をしました。「どうかお供させてください。私は強くて忠実です。だんごを一つくださるなら、忠実にお仕えします。」

      桃太郎が犬にだんごを渡すと、犬は仲間になりました。

      さらに道を進むと、木から猿が飛び降りてきました。「そのおいしそうなだんごを持ってどこへ行くのですか？」と猿が尋ねました。

      「鬼ヶ島へ鬼退治だ」と桃太郎は言いました。

      猿は喜んで手を叩きました。「私は賢くてすばしっこい。だんご一つと引き換えに連れて行ってください。」

      桃太郎が猿にだんごを渡すと、猿も仲間になりました。

      しばらくすると、空から雉が舞い降りてきました。「あなたの旅のことを聞きました」と雉は言いました。「私は高く飛んで敵を偵察できます。だんご一つでお供させていただけませんか？」

      桃太郎が承知すると、今や三匹の心強い仲間が揃いました。

      四人は力を合わせて海を渡り、鬼ヶ島へ向かいました。到着すると、鉄の門に囲まれた大きな砦がありました。角を生やし目を剥いた鬼たちは、若い少年と動物の仲間たちを見て笑い声を上げました。

      しかし桃太郎は少しも恐れませんでした。雉は壁を飛び越えて鬼の目をつつきました。猿は門をよじ登り内側から開けました。犬は飛び込んで鬼たちに噛みつき、取っ組み合って地面に押し倒しました。そして桃太郎自身は大いなる力と勇気をもって鬼の大将と戦いました。

      鬼の大将は打ち負かされ震えながら膝をつきました。「どうか命をお助けください！」と懇願しました。「二度と暴れ回りません。奪ったものはすべてお返しします。」

      桃太郎は一つの条件のもとに承知しました。鬼たちが約束を守り、おとなしく暮らすということです。鬼たちは同意し、人々から奪ったすべての宝を差し出しました。

      桃太郎は宝を荷車に積んで海を渡り故郷へ帰りました。お父さんとお母さんは桃太郎の姿を見て涙を流して喜びました。村中が祝い、宝は苦しんでいた人々に分け与えられました。

      その日から、桃太郎、おじいさん、おばあさん、犬、猿、雉はみんなで仲良く幸せに暮らしました。

      そして鬼ヶ島の鬼たちは、二度とその名を聞くことがありませんでした。
